<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevLog — Post</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="posts.html" class="nav-brand">DevLog</a>
  <div class="nav-links">
    <a href="posts.html">← posts</a>
    <a href="dashboard.html">dashboard</a>
    <span id="nav-user"></span>
    <span id="nav-auth"></span>
  </div>
</nav>

<div class="container">
  <div id="alert" class="alert" style="display:none;"></div>
  <div id="post-content"><div class="loading">// loading post</div></div>
  <div id="comments-section" style="display:none;">
    <hr class="divider">
    <div class="section-label">// comments</div>
    <div id="visibility-note" class="visibility-banner" style="margin-bottom:16px;"></div>
    <div id="comments-list"></div>
    <div id="comment-form" style="display:none;margin-top:20px;">
      <div class="form-group">
        <label>Add Comment</label>
        <textarea id="comment-text" placeholder="Write your comment..."></textarea>
      </div>
      <button class="btn btn-primary" onclick="postComment()">Post Comment</button>
    </div>
    <div id="comment-login-note" style="display:none;margin-top:16px;font-size:11px;color:var(--muted);">
      <a href="index.html" style="color:var(--text);">Login</a> to add a comment.
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');
  const user = getUser();

  renderNav();

  if (!postId) window.location.href = 'posts.html';

  async function loadPost() {
    try {
      const post = await apiFetch(`/api/posts/${postId}`);
      const isAdmin = user?.isAdmin;

      document.title = `DevLog — ${post.title}`;

      document.getElementById('post-content').innerHTML = `
        <div style="margin-bottom:8px;">
          <span class="badge ${post.isPublished ? 'badge-published' : 'badge-draft'}">${post.isPublished ? 'published' : 'draft'}</span>
        </div>
        <h1 style="font-size:22px;font-weight:700;color:var(--white);margin-bottom:12px;line-height:1.3;">${post.title}</h1>
        <div class="post-meta" style="margin-bottom:24px;">
          ${post.author ? `<span>by <strong style="color:var(--text);">${post.author.username}</strong></span>` : '<span style="color:var(--dim)">author hidden — join team to see</span>'}
          ${post.createdAt ? `<span>${formatDate(post.createdAt)}</span>` : ''}
        </div>
        <div style="font-size:14px;line-height:1.8;color:#ccc;white-space:pre-wrap;">${post.content}</div>
        ${isAdmin ? `
        <hr class="divider">
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" onclick="togglePublish()">
            ${post.isPublished ? 'Unpublish' : 'Publish'}
          </button>
          <button class="btn btn-danger" onclick="deletePost()">Delete</button>
        </div>` : ''}
      `;

      document.getElementById('comments-section').style.display = 'block';

      // Visibility note for comments
      const note = document.getElementById('visibility-note');
      if (!isLoggedIn()) {
        note.textContent = '// Guest view — comment authors hidden.';
      } else if (user && !user.isMember) {
        note.textContent = '// Not a member — comment authors hidden. Join team to see.';
      } else {
        note.textContent = '// Member view — full attribution visible.';
        note.style.borderColor = '#1a2a1a';
        note.style.color = '#4a9a4a';
      }

      if (isLoggedIn()) {
        document.getElementById('comment-form').style.display = 'block';
      } else {
        document.getElementById('comment-login-note').style.display = 'block';
      }

      loadComments();
    } catch (e) {
      showAlert('alert', 'Post not found or not published.');
    }
  }

  async function loadComments() {
    try {
      const comments = await apiFetch(`/api/posts/${postId}/comments`);
      const list = document.getElementById('comments-list');
      if (!comments.length) {
        list.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:12px 0;">No comments yet.</div>';
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="comment">
          <div class="comment-author">
            ${c.author ? c.author.username : '[ anonymous ]'} · ${formatDate(c.createdAt)}
            ${user?.isAdmin ? `<button class="btn btn-danger" style="padding:2px 8px;font-size:10px;margin-left:12px;" onclick="deleteComment(${c.id})">delete</button>` : ''}
          </div>
          <div class="comment-text">${c.text}</div>
        </div>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function postComment() {
    const text = document.getElementById('comment-text').value.trim();
    if (!text) return showAlert('alert', 'Comment cannot be empty.');
    try {
      await apiFetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        body: JSON.stringify({ text })
      });
      document.getElementById('comment-text').value = '';
      loadComments();
    } catch (e) {
      showAlert('alert', e.message);
    }
  }

  async function togglePublish() {
    try {
      await apiFetch(`/api/posts/${postId}/publish`, { method: 'PATCH' });
      loadPost();
    } catch (e) {
      showAlert('alert', e.message);
    }
  }

  async function deletePost() {
    if (!confirm('Delete this post permanently?')) return;
    try {
      await apiFetch(`/api/posts/${postId}`, { method: 'DELETE' });
      window.location.href = 'posts.html';
    } catch (e) {
      showAlert('alert', e.message);
    }
  }

  async function deleteComment(id) {
    if (!confirm('Delete this comment?')) return;
    try {
      await apiFetch(`/api/comments/${id}`, { method: 'DELETE' });
      loadComments();
    } catch (e) {
      showAlert('alert', e.message);
    }
  }

  loadPost();
</script>
</body>
</html>
